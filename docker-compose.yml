
services:
  
  app: 
    build: .
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=${DATABASE_URL}  
    depends_on:
      db:
        condition: service_healthy

         
  db:
    image: postgres:16 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ajmal -d postgres"]  
      interval: 5s
      timeout: 5s 
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data   #no space  after colon
volumes:
  postgres_data:       

    

